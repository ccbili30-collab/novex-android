name: Android quick validation

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - "src/android/**"
      - "scripts/prepare_android_sandbox.sh"
      - ".github/workflows/android-*.yml"
  workflow_dispatch:

concurrency:
  group: android-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests and channel compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ""

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Prepare sandbox runtime
        run: ./scripts/prepare_android_sandbox.sh

      - name: Run quick validation
        working-directory: src/android
        env:
          NOVEX_PREFER_CANONICAL_REPOSITORIES: "true"
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :app:testStableDebugUnitTest
          :app:compilePreviewDebugKotlin

      - name: Upload test report after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quick-validation-${{ github.sha }}
          path: src/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
